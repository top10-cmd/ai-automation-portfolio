<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI CRM Lead Assistant</title><style>body{margin:0;background:#f5f7fb;color:#17243a;font:14px system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:34px 18px}.head{display:flex;justify-content:space-between;align-items:center}.head h1{font-size:25px}.badge{background:#eef1ff;color:#5367d0;padding:8px 11px;border-radius:99px;font-size:12px;font-weight:700}.card{background:#fff;border:1px solid #e2e8f1;border-radius:17px;padding:22px;margin-top:20px}.label{display:block;color:#6d7b90;font-size:12px;font-weight:700;margin:13px 0 7px}.area{width:100%;min-height:120px;border:1px solid #dce3ee;border-radius:10px;padding:12px;box-sizing:border-box;resize:vertical}.btn{border:0;border-radius:10px;padding:12px 17px;background:#4e68ed;color:#fff;font-weight:800;margin-top:14px;cursor:pointer}.result{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.metric{background:#f7f8fc;border-radius:10px;padding:13px}.metric small{display:block;color:#78869b;margin-bottom:6px}.next{margin-top:14px;background:#eef9f3;color:#187a4c;padding:14px;border-radius:10px;line-height:1.5}@media(max-width:700px){.result{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div class="head"><h1>✦ AI CRM Lead Assistant</h1><span class="badge">DEMO / MOCK MODE</span></div><section class="card"><label class="label">Новый лид</label><textarea id="lead" class="area">Здравствуйте! Нам нужен сервис поддержки для интернет-магазина на 15 операторов. Хотим запустить в следующем месяце, пришлите условия и стоимость.</textarea><button class="btn" id="run">Обработать лид →</button><div id="result"></div></section></main><script>document.querySelector('#run').onclick=()=>document.querySelector('#result').innerHTML='<div class="result"><div class="metric"><small>Категория</small><b>B2B SaaS</b></div><div class="metric"><small>Приоритет</small><b style="color:#d88919">Высокий</b></div><div class="metric"><small>Этап</small><b>Новый лид</b></div><div class="metric"><small>Следующий шаг</small><b>Демо</b></div></div><div class="next"><b>Рекомендованное действие</b><br>Назначить менеджеру задачу: связаться в течение рабочего дня и отправить коммерческое предложение. Черновик ответа: «Спасибо за обращение! Подскажите, пожалуйста, удобное время для короткой демонстрации — мы покажем, как решение закрывает задачи вашей команды.»</div>'</script></body></html>
