<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI CRM Lead Assistant — демо</title>
  <style>
    body{margin:0;background:#f5f7fb;color:#17243a;font:14px system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:34px 18px}.head{display:flex;justify-content:space-between;align-items:center}.head h1{font-size:25px}.badge{background:#eef1ff;color:#5367d0;padding:8px 11px;border-radius:99px;font-size:12px;font-weight:700}.card{background:#fff;border:1px solid #e2e8f1;border-radius:17px;padding:22px;margin-top:20px}.label{display:block;color:#6d7b90;font-size:12px;font-weight:700;margin:13px 0 7px}.area{width:100%;min-height:120px;border:1px solid #dce3ee;border-radius:10px;padding:12px;box-sizing:border-box;resize:vertical}.btn{border:0;border-radius:10px;padding:12px 17px;background:#4e68ed;color:#fff;font-weight:800;margin-top:14px;cursor:pointer}.result{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.metric{background:#f7f8fc;border-radius:10px;padding:13px}.metric small{display:block;color:#78869b;margin-bottom:6px}.next{margin-top:14px;background:#eef9f3;color:#187a4c;padding:14px;border-radius:10px;line-height:1.5}.why{margin-top:12px;background:#fff8e9;color:#7f5c18;padding:12px;border-radius:10px;line-height:1.5}.muted{color:#748198}@media(max-width:700px){.result{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<main class="wrap"><div class="head"><h1>✦ AI CRM Lead Assistant</h1><span class="badge">DEMO / MOCK MODE</span></div>
<section class="card"><label class="label">Новый лид</label><textarea id="lead" class="area">Здравствуйте! Нам нужен сервис поддержки для интернет-магазина на 15 операторов. Хотим запустить в следующем месяце, пришлите условия и стоимость.</textarea><button class="btn" id="run">Обработать лид →</button><div id="result"></div></section></main>
<script>
const lead=document.querySelector('#lead'), result=document.querySelector('#result');
document.querySelector('#run').onclick=()=>{
  const text=lead.value.trim(), t=text.toLowerCase();
  if(!text){result.innerHTML='<p class="muted">Введите синтетический текст лида, чтобы запустить разбор.</p>';return;}
  const refusal=/(не нужно|не планир|ничего покупать|ошибся|отказ|отпиш|не интерес)/i.test(t);
  const urgent=/(срочно|сегодня|не работает|авар|критич)/i.test(t);
  const commercial=/(цена|стоимость|купить|условия|коммерчес|сервис|решение|оператор|поддержк|внедр)/i.test(t);
  const category=refusal?'Отказ / нерелевантно':commercial?'Коммерческий запрос':urgent?'Срочный запрос':'Нужно уточнение';
  const priority=refusal?'Низкий':urgent?'Высокий':commercial?'Средний':'Низкий';
  const stage=refusal?'Закрыть без продажи':commercial?'Новый лид':urgent?'Требует быстрой проверки':'Нужно уточнение';
  const step=refusal?'Не создавать задачу':commercial?'Уточнить задачу и назначить контакт':'Задать уточняющий вопрос';
  const action=refusal?'Спасибо за уточнение. Закрываем обращение без навязчивых предложений.':commercial?'Спасибо за обращение! Подскажите, пожалуйста, удобное время для короткого разговора — после уточнения задачи подготовим подходящий вариант.':'Спасибо за сообщение! Уточните, пожалуйста, задачу, сроки и желаемый результат.';
  const reason=refusal?'В тексте есть признаки отказа или нерелевантного обращения.':urgent?'Найдены слова срочности — приоритет поднят.':commercial?'Найдены признаки коммерческого интереса.':'Недостаточно сигналов — сначала нужен вопрос менеджера.';
  result.innerHTML=`<div class="result"><div class="metric"><small>Категория</small><b>${category}</b></div><div class="metric"><small>Приоритет</small><b style="color:${priority==='Высокий'?'#c44949':priority==='Средний'?'#d88919':'#5c718d'}">${priority}</b></div><div class="metric"><small>Этап</small><b>${stage}</b></div><div class="metric"><small>Следующий шаг</small><b>${step}</b></div></div><div class="why"><b>Почему так:</b><br>${reason}</div><div class="next"><b>Черновик действия</b><br>${action}<br><br><span class="muted">В mock-режиме реальная CRM-задача не создаётся. Перед отправкой оператор проверяет результат.</span></div>`;
};
</script>
</body>
</html>
